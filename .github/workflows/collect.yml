name: collect
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: '보고서 날짜(YYYY-MM-DD, 비우면 자동)'
        required: false
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4
      - run: python collect.py
        env:
          PRINT_SEARCH_URL: ${{ secrets.PRINT_SEARCH_URL }}
          SEARCH_QUERY: ${{ vars.SEARCH_QUERY }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          FORCE_PRINT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: 변경이 있으면 저장
        run: |
          git config user.name "collector"; git config user.email "collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update" && git pull --rebase -q && git push)
