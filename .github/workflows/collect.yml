name: collect

on:
  schedule:
    # 5분마다 실행
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: '보고서 날짜(YYYY-MM-DD, 비우면 자동)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 문체부 관련 기사 수집
        run: python collect.py
        env:
          REPORT_DATE: ${{ github.event.inputs.report_date }}

      - name: 수집 결과 저장
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "새로운 기사가 없어 커밋하지 않습니다."
          else
            git commit -m "update: 문화체육관광부 관련 보도"
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
